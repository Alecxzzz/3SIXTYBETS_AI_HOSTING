services:
  - type: web
    name: 3sixtybets-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /data/threesixtybets.db
    disks:
      - name: threesixtybets-data
        mountPath: /data
        sizeGB: 1
