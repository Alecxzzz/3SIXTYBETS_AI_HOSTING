<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>threesixtybets-chat</title>
    <script type="module" crossorigin src="/assets/index-BKSiNMfX.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CQTfAbHs.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Historial de transacciones (3SIXTYBETS AI): boton flotante + panel
         con el historial de pagos (Pagadito) y descarga de factura PDF. */
      (function () {
        var API_BASE = 'https://site--threesixtybetssz--qytms2wflqbs.code.run'.replace(/\/$/, '');
        var SESSION_KEY = 'threesixtybets_session';
        function getSession() {
          try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
        }
        function apiUrl(path) { return API_BASE + path; }

        var css = document.createElement('style');
        css.textContent = [
          '.txh-btn{position:fixed;right:18px;bottom:18px;z-index:9998;display:none;align-items:center;gap:8px;',
          'padding:10px 16px;border:none;border-radius:24px;background:#f5b942;color:#111;',
          'font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45);font-family:inherit;}',
          '.txh-btn:hover{background:#ffd061;}',
          '.txh-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);display:none;',
          'align-items:center;justify-content:center;padding:16px;font-family:inherit;}',
          '.txh-overlay.open{display:flex;}',
          '.txh-panel{background:#141821;color:#e8e8e8;border:1px solid #2a3040;border-radius:14px;',
          'width:100%;max-width:760px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}',
          '.txh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #2a3040;}',
          '.txh-head h2{margin:0;font-size:18px;color:#f5b942;}',
          '.txh-close{background:none;border:none;color:#888;font-size:22px;cursor:pointer;line-height:1;}',
          '.txh-close:hover{color:#fff;}',
          '.txh-body{overflow:auto;padding:8px 20px 20px;}',
          '.txh-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}',
          '.txh-table th{text-align:left;color:#8b93a5;font-weight:600;padding:8px 10px;border-bottom:1px solid #2a3040;white-space:nowrap;}',
          '.txh-table td{padding:10px;border-bottom:1px solid #1e2430;vertical-align:middle;}',
          '.txh-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;}',
          '.txh-APROBADO{background:#1d3a26;color:#4ade80;}',
          '.txh-PENDIENTE{background:#3a311d;color:#facc15;}',
          '.txh-CANCELADO,.txh-RECHAZADO,.txh-FALLIDO{background:#3a1d1d;color:#f87171;}',
          '.txh-EXPIRADO{background:#262636;color:#a5b4fc;}',
          '.txh-pdf{background:#f5b942;border:none;color:#111;font-weight:700;padding:6px 12px;',
          'border-radius:8px;cursor:pointer;font-size:12px;white-space:nowrap;}',
          '.txh-pdf:hover{background:#ffd061;}',
          '.txh-pdf:disabled{opacity:.5;cursor:default;}',
          '.txh-empty,.txh-err{text-align:center;color:#8b93a5;padding:40px 10px;font-size:14px;}',
          '.txh-err{color:#f87171;}',
          '.txh-refresh{background:none;border:1px solid #2a3040;color:#8b93a5;border-radius:8px;',
          'padding:4px 10px;font-size:12px;cursor:pointer;}',
          '.txh-refresh:hover{color:#f5b942;border-color:#f5b942;}'
        ].join('');
        document.head.appendChild(css);

        var overlay = document.createElement('div');
        overlay.className = 'txh-overlay';
        overlay.innerHTML =
          '<div class="txh-panel" role="dialog" aria-label="Historial de transacciones">' +
          '<div class="txh-head"><h2>Historial de transacciones</h2>' +
          '<button class="txh-close" type="button" aria-label="Cerrar">&times;</button></div>' +
          '<div class="txh-body"><div class="txh-content"></div></div></div>';

        document.body.appendChild(overlay);

        var content = overlay.querySelector('.txh-content');

        function openPanel() {
          overlay.classList.add('open');
          loadAndRender();
        }

        /* Interceptar el clic en el item "Historial de transacciones" del
           menu lateral (añadido en el bundle) para abrir este panel en vez
           de dejar que la app cambie a una pagina inexistente. */
        document.addEventListener('click', function (e) {
          var el = e.target && e.target.closest ? e.target.closest('aside button') : null;
          if (el && el.textContent.indexOf('Historial de transacciones') !== -1) {
            e.preventDefault();
            e.stopPropagation();
            openPanel();
          }
        }, true);
        overlay.querySelector('.txh-close').addEventListener('click', function () {
          overlay.classList.remove('open');
        });
        overlay.addEventListener('click', function (e) {
          if (e.target === overlay) overlay.classList.remove('open');
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') overlay.classList.remove('open');
        });

        function fmtDate(iso) {
          if (!iso) return '-';
          return String(iso).replace('T', ' ').slice(0, 16);
        }

        function downloadInvoice(tx, btnEl) {
          var session = getSession();
          if (!session || !session.access_token) return;
          var original = btnEl.textContent;
          btnEl.disabled = true;
          btnEl.textContent = 'Generando...';
          fetch(apiUrl('/transactions/' + encodeURIComponent(tx.ern) + '/invoice?token=' + encodeURIComponent(session.access_token)))
            .then(function (r) {
              if (!r.ok) throw new Error('No se pudo generar la factura.');
              return r.blob();
            })
            .then(function (blob) {
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url;
              a.download = 'factura-' + tx.ern + '.pdf';
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
            })
            .catch(function (err) { alert(err.message || 'Error al descargar la factura.'); })
            .then(function () {
              btnEl.disabled = false;
              btnEl.textContent = original;
            });
        }

        function render(transactions) {
          if (!transactions.length) {
            content.innerHTML = '<div class="txh-empty">Aun no tienes transacciones registradas.<br>Cuando compres una suscripcion aparecera aqui con su factura.</div>';
            return;
          }
          var rows = transactions.map(function (tx) {
            return '<tr>' +
              '<td>' + fmtDate(tx.created_at) + '</td>' +
              '<td>' + String(tx.plan_code || '') + '</td>' +
              '<td>' + (tx.currency || 'USD') + ' ' + Number(tx.amount).toFixed(2) + '</td>' +
              '<td><span class="txh-badge txh-' + tx.status_label + '">' + tx.status_label + '</span></td>' +
              '<td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + String(tx.ern) + '">' + String(tx.ern) + '</td>' +
              '<td><button class="txh-pdf" type="button" data-ern="' + String(tx.ern) + '">Factura PDF</button></td>' +
              '</tr>';
          }).join('');
          content.innerHTML =
            '<div style="text-align:right;margin-top:10px;"><button class="txh-refresh" type="button">Actualizar</button></div>' +
            '<table class="txh-table"><thead><tr><th>Fecha</th><th>Plan</th><th>Monto</th><th>Estado</th>' +
            '<th>Transacci\u00f3n</th><th>Factura</th></tr></thead><tbody>' + rows + '</tbody></table>';
          content.querySelector('.txh-refresh').addEventListener('click', loadAndRender);
          content.querySelectorAll('.txh-pdf').forEach(function (el) {
            el.addEventListener('click', function () {
              var ern = el.getAttribute('data-ern');
              var tx = transactions.filter(function (t) { return t.ern === ern; })[0];
              if (tx) downloadInvoice(tx, el);
            });
          });
        }

        function loadAndRender() {
          var session = getSession();
          if (!session || !session.access_token) {
            content.innerHTML = '<div class="txh-err">Inicia sesion para ver tu historial de transacciones.</div>';
            return;
          }
          content.innerHTML = '<div class="txh-empty">Cargando...</div>';
          fetch(apiUrl('/transactions'), { headers: { Authorization: 'Bearer ' + session.access_token } })
            .then(function (r) {
              if (r.status === 401) throw new Error('Tu sesion expiro. Vuelve a iniciar sesion.');
              if (!r.ok) throw new Error('No se pudo cargar el historial.');
              return r.json();
            })
            .then(function (data) { render(data.transactions || []); })
            .catch(function (err) {
              content.innerHTML = '<div class="txh-err">' + (err.message || 'Error al cargar el historial.') + '</div>';
            });
        }

        function checkSession() {
          /* Reservado: la visibilidad ahora la maneja el menu lateral. */
        }
        window.addEventListener('threesixtybets:session-expired', checkSession);
        window.addEventListener('storage', checkSession);
      })();
    </script>
  </body>
</html>
